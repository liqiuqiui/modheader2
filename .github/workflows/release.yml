name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # 手动触发只用于演练构建：产物打到 artifact 就结束，不建 Release、不上架。
      version:
        description: "构建演练用的版本号，例如 1.2.0（不带 v 前缀）"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PNPM_VERSION: "10.33.4"
  NODE_VERSION: "24"

jobs:
  # 版本号先单独解析：矩阵 job 的 outputs 会相互覆盖，不能由矩阵产出版本号。
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # 非法 semver 会让后续 wxt zip 产出带坏版本号的 manifest，在这里就拦掉。
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$VERSION' is not a valid semver (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.browser }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只发布 Chromium 目标：firefox/safari 是 MV2 产物，而规则下发依赖
        # declarativeNetRequest（MV3），装上去会在运行时报错。
        # opera 会额外产出 *-sources.zip（提交审核需要）。
        browser: [chrome, edge, opera]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WXT 的 manifest.version 与 zip 文件名均取自 package.json，先对齐标签版本
      - name: Set version from tag
        run: npm pkg set version="${{ needs.version.outputs.version }}"

      - name: Zip extension
        run: pnpm exec wxt zip -b ${{ matrix.browser }}

      # firefox 与 opera 都会产出同名的 *-sources.zip，合并进同一个 Release 时
      # 会互相覆盖，统一改名成 <browser>-sources.zip 保证文件名唯一。
      # 已改过名的跳过，保证这一步可以重复执行。
      - name: Rename sources zip
        run: |
          shopt -s nullglob
          for f in .output/*-sources.zip; do
            case "$f" in
              *-${{ matrix.browser }}-sources.zip) continue ;;
            esac
            mv "$f" "${f%-sources.zip}-${{ matrix.browser }}-sources.zip"
          done

      - name: List zips
        run: ls -lh .output/*.zip

      # 同 CI：.output 是点开头目录且被 gitignore，artifact 的 glob 会漏掉它，
      # 拷到普通目录后再上传。
      - name: Collect zips
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp .output/*.zip artifacts/
          ls -lh artifacts/

      - name: Upload zips
        uses: actions/upload-artifact@v7
        with:
          name: modheader-${{ needs.version.outputs.version }}-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft GitHub Release
    needs: [version, package]
    runs-on: ubuntu-latest
    # 只在推 tag 时建 Release；workflow_dispatch 是纯构建演练，不发版。
    # 建草稿而非正式 Release：发布说明需要人工在 GitHub 上定稿，
    # Publish 之后才会触发 publish-store.yml 上架商店。
    if: ${{ github.event_name == 'push' }}
    steps:
      # body_path 要读仓库里的 .github/RELEASE_NOTES.md，所以必须先 checkout。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download zips
        uses: actions/download-artifact@v8
        with:
          pattern: modheader-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*.zip
          # 发布说明由人写：取自 .github/RELEASE_NOTES.md，随代码一起 review。
          # 不用 generate_release_notes——它按英文关键词分类，中文提交信息会
          # 全部落进 Other Changes，且完全丢弃 commit 正文。
          body_path: .github/RELEASE_NOTES.md
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
